name: Build & Rolling Release

on:
  push:
    branches: [ "main" ]
    paths:
      - 'Cargo.toml'
  workflow_dispatch:

jobs:
  prepare:
    name: Get Version
    runs-on: ubuntu-latest
    outputs:
      app_version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Parse Workspace Version
        id: get_version
        run: |
          VERSION=$(grep -m 1 "^version" Cargo.toml | awk -F '"' '{print $2}')
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Found workspace version: $VERSION"

  build-windows:
    name: Build Windows (x64)
    needs: prepare
    runs-on: windows-latest
    env:
      ASSET: neko-windows-x64.zip
    steps:
      - uses: actions/checkout@v5

      - name: Build All Crates
        run: cargo build --release

      - name: Gather and Zip Binaries
        shell: bash
        run: |
          mkdir -p staging
          for toml in crates/*/Cargo.toml; do
            BIN_NAME=$(grep -m 1 "^name" "$toml" | awk -F '"' '{print $2}' | tr -d ' ')
            cp "target/release/${BIN_NAME}.exe" staging/
          done
          cd staging
          7z a "../${ASSET}" *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-zip
          path: ${{ env.ASSET }}
          retention-days: 1

  build-linux:
    name: Build Linux (${{ matrix.flavor }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - flavor: x64
            runner: ubuntu-22.04
          - flavor: arm
            runner: ubuntu-22.04-arm
    env:
      ASSET: neko-linux-${{ matrix.flavor }}.zip
    steps:
      - uses: actions/checkout@v5

      - name: Build All Crates
        run: cargo build --release

      - name: Gather, Executable, and Zip Binaries
        run: |
          mkdir -p staging
          for toml in crates/*/Cargo.toml; do
            BIN_NAME=$(grep -m 1 "^name" "$toml" | awk -F '"' '{print $2}' | tr -d ' ')
            cp "target/release/${BIN_NAME}" staging/
            chmod +x "staging/${BIN_NAME}"
          done
          cd staging
          zip -r "../${ASSET}" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.flavor }}-zip
          path: ${{ env.ASSET }}
          retention-days: 1

  build-macos:
    name: Build MacOS (${{ matrix.flavor }})
    needs: prepare
    runs-on: macos-latest
    strategy:
      matrix:
        include:
          - flavor: arm
            target: aarch64-apple-darwin
          - flavor: x64
            target: x86_64-apple-darwin
    env:
      ASSET: neko-mac-${{ matrix.flavor }}.zip
    steps:
      - uses: actions/checkout@v5

      - name: Add Rust Target
        run: rustup target add ${{ matrix.target }}

      - name: Build All Crates
        run: cargo build --release --target ${{ matrix.target }}

      - name: Gather, Executable, and Zip Binaries
        run: |
          mkdir -p staging
          for toml in crates/*/Cargo.toml; do
            BIN_NAME=$(grep -m 1 "^name" "$toml" | awk -F '"' '{print $2}' | tr -d ' ')
            cp "target/${{ matrix.target }}/release/${BIN_NAME}" staging/
            chmod +x "staging/${BIN_NAME}"
          done
          cd staging
          zip -r "../${ASSET}" ./*

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.flavor }}-zip
          path: ${{ env.ASSET }}
          retention-days: 1

  publish-rolling:
    name: Publish Rolling Release
    needs: [ prepare, build-windows, build-linux, build-macos ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: '*-zip'
          merge-multiple: true
          path: final_assets

      - name: Update Rolling Release Page
        env:
          GH_TOKEN: ${{ secrets.MY_RELEASE_TOKEN }}
        run: |
          gh release delete rolling --cleanup-tag -y || true
          sleep 3
          gh release create rolling \
            --target ${{ github.sha }} \
            --title "v${{ needs.prepare.outputs.app_version }}" \
            --notes "Pre-built and packaged binaries by operating system and architecture." \
            final_assets/*.zip
